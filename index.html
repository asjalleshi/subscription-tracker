
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Subscription Tracker</title>
    <link rel="stylesheet" href="css/styles.css">
    <script src="js/app.js" defer></script>
</head>
<body>

    <header>
        <h1>Subscription Tracker</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="add.html">Add Subscription</a>
            <a href="expenses.html">Expenses</a>
        </nav>
    </header>

    <main>
        <h2>Dashboard</h2>
        <p>Manage all your subscriptions in one place.</p>

        <section class="summary">
            <div class="card">
                <h3>Total Subscriptions</h3>
                <p id="totalCount">0</p>
            </div>

            <div class="card">
                <h3>Expired Subscriptions</h3>
                <p id="expiredCount">0</p>
            </div>
        </section>

        <section>
            <h2>Quick Actions</h2>
            <a class="btn" href="add.html">Add New Subscription</a>
            <a class="btn" href="expenses.html">View Expenses</a>
        </section>
    </main>

</body>
</html>
