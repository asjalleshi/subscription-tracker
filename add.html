
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Subscription</title>
    <link rel="stylesheet" href="styles.css">
    <script src="app.js" defer></script>
</head>
<body>
    <header>
        <h1>Subscription Tracker</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="add.html">Add</a>
            <a href="expenses.html">Expenses</a>
        </nav>
    </header>

    <main>
        <section class="form-section">
            <h2>Add New Subscription</h2>

            <form id="subscriptionForm">
                <label for="service">Service Name</label>
                <input type="text" id="service" placeholder="Netflix" required>

                <label for="provider">Provider</label>
                <input type="text" id="provider" placeholder="Netflix Inc." required>

                <label for="subscriber">Subscriber</label>
                <input type="text" id="subscriber" placeholder="Your name" required>

                <label for="renewalDate">Renewal Date</label>
                <input type="date" id="renewalDate" required>

                <label for="category">Category</label>
                <select id="category" required>
                    <option value="">Select Category</option>
                    <option value="Entertainment">Entertainment</option>
                    <option value="Music">Music</option>
                    <option value="Software">Software</option>
                    <option value="Other">Other</option>
                </select>

                <button type="submit">Add Subscription</button>
            </form>
        </section>
    </main>

    <footer>
        <p>Subscription Tracker - 2026</p>
    </footer>
</body>
</html>
